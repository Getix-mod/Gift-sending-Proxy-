</head>

    <script>
        let adCount = 0;
        let adStartTime = null;
        const smartLink = "https://doubtfulimpatient.com/zmbhbe4gwx?key=6e7beaf55cefdff1c26e0cb345acdd68";
        
        const actionBtn = document.getElementById('action-btn');
        const finalLink = document.getElementById('final-link');
        const statusMsg = document.getElementById('status-msg');
        const countDisplay = document.getElementById('count-text');

        // Ad tracking logic
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && adStartTime !== null) {
                let timeSpent = (Date.now() - adStartTime) / 1000;
                
                if (timeSpent < 10) {
                    statusMsg.innerHTML = "<span class='red'>Error: Aap jaldi wapas aa gaye! 10s rukna zaruri hai.</span>";
                    adStartTime = null;
                    actionBtn.disabled = false;
                } else {
                    adCount++;
                    countDisplay.innerText = adCount + " / 10";
                    adStartTime = null;
                    
                    if (adCount >= 10) {
                        actionBtn.style.display = 'none';
                        finalLink.style.display = 'block';
                        statusMsg.innerHTML = "<span class='green'>Success! Link Unlock ho gaya.</span>";
                    } else {
                        statusMsg.innerHTML = "<span class='green'>Ad Verified! Agla ad <span id='timer'>15</span>s mein ayega.</span>";
                        startCooldown(15);
                    }
                }
            }
        });

        function openAd() {
            statusMsg.innerHTML = "Ad khul raha hai... 10s wait karein.";
            adStartTime = Date.now();
            window.open(smartLink, '_blank');
            actionBtn.disabled = true;
        }

        function startCooldown(duration) {
            let timeLeft = duration;
            let interval = setInterval(() => {
                timeLeft--;
                let timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    actionBtn.disabled = false;
                    statusMsg.innerHTML = "Ab aap agla ad dekh sakte hain.";
                }
            }, 1000);
        }
    </script>
